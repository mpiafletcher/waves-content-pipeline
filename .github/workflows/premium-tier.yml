name: Waves Premium Tier Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

concurrency:
  group: waves-premium-pipeline
  cancel-in-progress: false

env:
  RSSHUB_BASE: https://rsshub-production-55fa.up.railway.app
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  WORKER_URL: ${{ secrets.WORKER_URL }}
  WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
  TEST_MODE: false
  PIPELINE_MODE: premium

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wake Railway service
        run: |
          echo "Pinging Railway to wake service..."
          curl -s --max-time 60 \
            --retry 5 --retry-delay 10 --retry-all-errors \
            "$RSSHUB_BASE/mpia/sport-training" -o /dev/null
          echo "Railway is up, waiting for full readiness..."
          sleep 5

      - name: Check RSSHub custom routes
        run: |
          routes=(
            "mpia/sport-training"
            "mpia/coachesvoice"
            "mpia/athletic-football"
            "mpia/racingpost-news"
            "mpia/ucl"
          )
          for route in "${routes[@]}"; do
            echo "Checking $route..."
            curl -f --retry 3 --retry-delay 5 "$RSSHUB_BASE/$route" -o /dev/null \
              || { echo "FAILED: $route"; exit 1; }
          done
          echo "All routes healthy"

      - name: Run pipeline — putter with fallback
        env:
          AUDIO_MODE: putter_with_fallback
        run: python src/main.py

      - name: Run pipeline — make only
        env:
          AUDIO_MODE: make_only
        run: python src/main.py
